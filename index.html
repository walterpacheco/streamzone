<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clon educativo inspirado en Disney+, no copia exacta de marca.">
    <meta name="author" content="Luis Araya y Walter Pacheco">
    <meta name="keywords" content="HTML, CSS, Bootstrap, JavaScript, Streaming, Frontend">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/custom.css">
    <title>StreamZone</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="#">
                    StreamZone
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido"
                    aria-controls="navbarContenido" aria-expanded="false" aria-label="Abrir menú">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContenido">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="#inicio">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#peliculas">Películas</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#series">Series</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#lista">Mi lista</a>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>
    </header>
    <main>
        <section class="hero-section" id="inicio">
            <div class="container">
                <div class="row align-items-center">

                    <article class="col-12 col-lg-6 hero-content">
                        <h1 class="hero-title">
                            Tus películas y series favoritas en un solo lugar
                        </h1>

                        <p class="hero-text">
                            Disfruta una experiencia de streaming moderna con películas, series y contenido destacado
                            para todos.
                        </p>

                        <div class="hero-buttons">
                            <a href="#peliculas" class="btn btn-primary hero-btn-primary">
                                Explorar catálogo
                            </a>

                            <a href="#planes" class="btn btn-outline-light hero-btn-secondary">
                                Ver planes
                            </a>
                        </div>
                    </article>

                    <figure class="col-12 col-lg-6 hero-figure">
                        <img src="./img/hero-streaming.jpg"
                            alt="Vista previa de películas y series en una plataforma de streaming"
                            class="img-fluid hero-image">
                    </figure>

                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StreamZone - Luis Araya y Walter Pacheco</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="./js/main.js"></script>
</body>

</html>
